name: Manual run

on:
  workflow_dispatch:  
  # manual run from github website
  # no commit no push!

env:
  tg_channel_id: ${{ secrets.TG_CHANNEL_ID }}
  tg_logger_id: ${{ secrets.TG_LOGGER_ID }}
  tg_token: ${{ secrets.TG_TOKEN }}
  ym_token: ${{ secrets.YM_TOKEN }}
  zv_token: ${{ secrets.ZV_TOKEN }}

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install dependencies (test)
        run: |
          python -m pip install --upgrade pip
          if [ -f 'Python Scripts/requirements.txt' ]; then pip install -r 'Python Scripts/requirements.txt'; fi

      - name: Execute py script
        run: python 'Python Scripts/AMR_LookApp_local.py'

